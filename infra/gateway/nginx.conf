server {
  listen 8080;
  server_name _;
  client_max_body_size 1m;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  location /api/v1/access/ {
    proxy_pass http://access:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Roles "";
    proxy_set_header X-User-Roles "";
  }

  location /api/v1/accounts/ {
    proxy_pass http://accounts:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Roles "";
    proxy_set_header X-User-Roles "";
  }

  location /api/v1/catalog/ {
    proxy_pass http://catalog:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Roles "";
    proxy_set_header X-User-Roles "";
  }

  location /api/v1/audit/ {
    proxy_pass http://audit:3004;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Roles "";
    proxy_set_header X-User-Roles "";
  }

  location /api/v1/ai/ {
    proxy_pass http://ai:3005;
    proxy_buffering off;
    proxy_read_timeout 70s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Roles "";
    proxy_set_header X-User-Roles "";
  }

  location = /services/access/health { proxy_pass http://access:3001/health; }
  location = /services/access/ready { proxy_pass http://access:3001/ready; }
  location = /services/access/capabilities { proxy_pass http://access:3001/capabilities; }
  location = /services/accounts/health { proxy_pass http://accounts:3002/health; }
  location = /services/accounts/ready { proxy_pass http://accounts:3002/ready; }
  location = /services/accounts/capabilities { proxy_pass http://accounts:3002/capabilities; }
  location = /services/catalog/health { proxy_pass http://catalog:3003/health; }
  location = /services/catalog/ready { proxy_pass http://catalog:3003/ready; }
  location = /services/catalog/capabilities { proxy_pass http://catalog:3003/capabilities; }
  location = /services/audit/health { proxy_pass http://audit:3004/health; }
  location = /services/audit/ready { proxy_pass http://audit:3004/ready; }
  location = /services/audit/capabilities { proxy_pass http://audit:3004/capabilities; }
  location = /services/ai/health { proxy_pass http://ai:3005/health; }
  location = /services/ai/ready { proxy_pass http://ai:3005/ready; }
  location = /services/ai/capabilities { proxy_pass http://ai:3005/capabilities; }

  location /internal/ {
    default_type application/json;
    return 404 '{"code":"RESOURCE_NOT_VISIBLE","message":"Ruta no publicada"}';
  }

  location /api/ {
    default_type application/json;
    return 404 '{"code":"RESOURCE_NOT_VISIBLE","message":"Ruta no publicada"}';
  }

  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }
}
