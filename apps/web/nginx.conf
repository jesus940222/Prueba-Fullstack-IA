server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    default_type application/json;
    return 404 '{"code":"RESOURCE_NOT_VISIBLE","message":"Ruta no publicada"}';
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
