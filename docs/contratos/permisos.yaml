  - beneficiaries:update:own
  - beneficiaries:delete:own
  - transfer-limits:read:own
  - transfer-limits:update:own
  - products:read
  - offers:read:own
  - users:read
  - security:recovery:initiate
  - audit:read:any
  - users:create
  - users:update
  - users:delete
  - users:restore
  - users:read:deleted
  - sessions:revoke:any
  - security:passkeys:configure
  - applications:read
  - applications:create
  - applications:update
  - applications:delete
  - applications:restore
  - applications:read:deleted
  - permissions:read
  - roles:read
