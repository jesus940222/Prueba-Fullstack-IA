          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    OfferAdmin:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - title
      - status
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
        benefitType:
          enum:
          - information
        benefitValue:
          type: string
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        priority:
          type: integer
        audienceType:
          enum:
          - general
          - rules
          - direct
        status:
          enum:
          - draft
          - active
          - disabled
    OfferAdminPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalItems
      - totalPages
      - page
      - pageSize
      properties:
        items:
          type: array
