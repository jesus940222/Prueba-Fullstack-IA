openapi: 3.1.0
info:
  title: Catálogo
  version: 1.0.0
  description: API /api/v1/catalog. No hay contratación ni registro de interés. Cada
    verbo tiene su permiso.
servers:
- url: /
paths:
  /api/v1/catalog/categories:
    get:
      operationId: listPublicCategories
      tags:
      - public
      summary: Categorías activas
      description: Solo activas.
      x-authorization:
        kind: permission
        permission: products:read
      responses:
        '200':
          description: Categorías activas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: La página fuera de rango devuelve items vacío.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Máximo 100.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt
          - -createdAt
        description: Allowlist. El desempate estable es el id.
  /api/v1/catalog/products:
    get:
      operationId: listPublicProducts
      tags:
      - public
      summary: Productos activos
      description: Sin borradores.
      x-authorization:
        kind: permission
        permission: products:read
      responses:
        '200':
          description: Productos activos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: La página fuera de rango devuelve items vacío.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Máximo 100.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt
          - -createdAt
        description: Allowlist. El desempate estable es el id.
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Filtro.
  /api/v1/catalog/products/{id}:
    get:
      operationId: getPublicProduct
      tags:
      - public
      summary: Producto activo
      description: El inactivo responde 404.
      x-authorization:
        kind: permission
        permission: products:read
      responses:
        '200':
          description: Producto activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/catalog/me/offers:
