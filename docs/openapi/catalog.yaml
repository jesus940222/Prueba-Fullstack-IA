components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
          enum:
          - SESSION_INVALID
          - PERMISSION_DENIED
          - RESOURCE_NOT_VISIBLE
          - CONFLICT
          - IDEMPOTENCY_CONFLICT
          - VALIDATION_ERROR
          - BUSINESS_RULE
          - RATE_LIMITED
          - DEPENDENCY_UNAVAILABLE
          - CSRF_INVALID
          - RECENT_VERIFICATION_REQUIRED
          - RECOVERY_POLICY_DISABLED
          - CHALLENGE_INVALID
        message:
          type: string
          maxLength: 300
        correlationId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
    Empty:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    Category:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
        status:
          enum:
          - active
          - disabled
    CategoryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalItems
      - totalPages
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    CategoryWrite:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        status:
          enum:
          - active
          - disabled
    Product:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - currency
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
        description:
          type: string
        currency:
          const: MXN
        termsVersion:
          type: integer
        termsText:
          type: string
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalItems
      - totalPages
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    ProductAdmin:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
        description:
          type: string
        currency:
          const: MXN
        termsVersion:
          type: integer
        termsText:
          type: string
        status:
          enum:
          - draft
          - active
          - disabled
        conditions:
          $ref: '#/components/schemas/ProductConditions'
    ProductAdminPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalItems
      - totalPages
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductAdmin'
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
