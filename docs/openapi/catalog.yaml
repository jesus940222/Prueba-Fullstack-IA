        totalPages:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    OfferWrite:
      type: object
      additionalProperties: false
      required:
      - productId
      - code
      - title
      - audienceType
      properties:
        productId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 4000
        benefitType:
          const: information
        benefitValue:
          type: string
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        priority:
          type: integer
          minimum: 0
          maximum: 1000
        audienceType:
          enum:
          - general
          - rules
          - direct
        status:
          enum:
          - draft
          - active
          - disabled
    EligibilityRules:
      type: object
      additionalProperties: false
      required:
      - rules
      properties:
        rules:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - operator
            - value
            properties:
              field:
                enum:
                - totalBalance
                - accountAgeDays
              operator:
                enum:
                - eq
                - gte
                - lte
              value:
                type: string
                maxLength: 40
    OfferAssignment:
      type: object
      additionalProperties: false
      required:
      - id
