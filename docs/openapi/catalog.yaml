      security:
      - sessionCookie: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: La página fuera de rango devuelve items vacío.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Máximo 100.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
