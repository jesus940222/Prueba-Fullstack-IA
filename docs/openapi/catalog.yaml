      properties:
        schemaVersion:
          type: integer
          minimum: 1
        attributes:
          type: object
          maxProperties: 30
          additionalProperties:
            type:
            - string
            - number
            - boolean
          description: El servidor solo acepta claves del esquema compilado para esa
            categoría y versión.
    Offer:
