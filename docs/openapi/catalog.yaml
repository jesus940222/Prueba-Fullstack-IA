          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 4000
        currency:
          const: MXN
        termsText:
          type: string
          maxLength: 8000
        status:
          enum:
          - draft
          - active
          - disabled
        conditions:
          $ref: '#/components/schemas/ProductConditions'
    ProductConditions:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
