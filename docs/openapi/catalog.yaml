      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
        benefitType:
          type: string
        benefitValue:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        eligible:
          type: boolean
        status:
          const: active
    OfferPage:
      type: object
      additionalProperties: false
      required:
