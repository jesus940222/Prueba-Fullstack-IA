openapi: 3.1.0
info:
  title: Acceso
  version: 1.0.0
  description: API /api/v1/access e interna de autorización. El correo no se edita
    en v1. La recuperación completa queda cerrada.
servers:
- url: /
paths:
  /api/v1/access/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Inicia desafío con correo y contraseña
      description: No crea sesión plena.
      x-authorization:
        kind: public
      responses:
        '200':
          description: Inicia desafío con correo y contraseña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/access/auth/oidc/{provider}/start:
    get:
      operationId: oidcStart
      tags:
      - auth
      summary: Inicia OIDC
      description: Google o Microsoft, con state, nonce y PKCE. returnTo solo interno.
      x-authorization:
        kind: redirect
      responses:
        '302':
          description: Inicia OIDC
          headers:
            Location:
              description: Destino interno o proveedor
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          enum:
          - google
          - microsoft
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
        description: Ruta interna.
  /api/v1/access/auth/oidc/{provider}/callback:
    get:
      operationId: oidcCallback
      tags:
      - auth
      summary: Callback OIDC
      description: Valida issuer, audience, firma, nonce, state y distingue login
        de vinculación.
      x-authorization:
        kind: redirect
      responses:
        '302':
          description: Callback OIDC
          headers:
            Location:
              description: Destino interno o proveedor
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          enum:
          - google
          - microsoft
      - name: code
        in: query
        required: false
        schema:
          type: string
        description: Código del proveedor.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Estado emitido por Acceso.
  /api/v1/access/auth/challenges/{id}/email/resend:
    post:
      operationId: resendEmailChallenge
      tags:
      - auth
      summary: Reenvía el código e invalida el anterior
      description: El desafío no otorga autorización funcional.
      x-authorization:
        kind: challenge
        csrf: true
      responses:
        '200':
          description: Reenvía el código e invalida el anterior
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - csrfHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/access/auth/challenges/{id}/email/verify:
    post:
      operationId: verifyEmailChallenge
      tags:
      - auth
      summary: Consume el código
      description: El desafío no otorga autorización funcional.
      x-authorization:
        kind: challenge
        csrf: true
      responses:
        '200':
          description: Consume el código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - csrfHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeProof'
  /api/v1/access/auth/challenges/{id}/passkey/options:
    post:
      operationId: passkeyOptions
      tags:
      - auth
      summary: Opciones WebAuthn del desafío
      description: El desafío no otorga autorización funcional.
      x-authorization:
        kind: challenge
        csrf: true
      responses:
        '200':
          description: Opciones WebAuthn del desafío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - csrfHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/access/auth/challenges/{id}/passkey/verify:
    post:
      operationId: verifyPasskey
      tags:
      - auth
      summary: Verifica la passkey
      description: El desafío no otorga autorización funcional.
      x-authorization:
        kind: challenge
        csrf: true
      responses:
        '200':
          description: Verifica la passkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - csrfHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeProof'
  /api/v1/access/auth/challenges/{id}/recovery-code/verify:
    post:
      operationId: verifyRecoveryCode
      tags:
      - auth
      summary: Código de recuperación restringido
      description: El desafío no otorga autorización funcional.
      x-authorization:
        kind: challenge
        csrf: true
      responses:
        '200':
          description: Código de recuperación restringido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStep'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - csrfHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeProof'
  /api/v1/access/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags:
      - auth
      summary: Solicita recuperación
      description: Respuesta genérica, exista o no la cuenta.
      x-authorization:
        kind: public
      responses:
        '202':
          description: Solicita recuperación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
  /api/v1/access/auth/password/reset:
    post:
      operationId: resetPassword
      tags:
      - auth
      summary: Restablece contraseña
      description: Token de un uso. Revoca sesiones y no omite la passkey.
      x-authorization:
        kind: public
      responses:
        '204':
          description: Restablece contraseña
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
  /api/v1/access/auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - auth
      summary: Rota el refresh
      description: Reutilizar un refresh revoca la familia.
      x-authorization:
        kind: session
      responses:
        '204':
          description: Rota el refresh
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/access/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Cierra la sesión actual
      description: Idempotente.
      x-authorization:
        kind: session
      responses:
        '204':
          description: Cierra la sesión actual
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/access/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
      - auth
      summary: Cierra todas las sesiones propias
      description: Revoca refresh de la persona.
      x-authorization:
        kind: session
      responses:
        '204':
          description: Cierra todas las sesiones propias
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/access/me:
    get:
      operationId: getMe
      tags:
      - profile
      summary: Lee el perfil
      description: Sin roles ni secretos.
      x-authorization:
        kind: permission
        permission: profile:read:own
      responses:
        '200':
          description: Lee el perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
    patch:
      operationId: updateMe
      tags:
      - profile
      summary: Actualiza el perfil
      description: 'Allowlist: nombre, teléfono y tema. El correo no es editable en
        v1.'
      x-authorization:
        kind: permission
        permission: profile:update:own
      responses:
        '200':
          description: Actualiza el perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
  /api/v1/access/me/permissions:
    get:
      operationId: listMyPermissions
      tags:
      - profile
      summary: Permisos efectivos
      description: La UI no los convierte en autorización.
      x-authorization:
        kind: session
      responses:
        '200':
          description: Permisos efectivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
  /api/v1/access/me/password/change:
    post:
      operationId: changePassword
      tags:
      - security
      summary: Cambia la contraseña
      description: Exige verificación reciente y revoca las otras sesiones.
      x-authorization:
        kind: permission
        permission: security:manage:own
        recentVerification: true
      responses:
        '204':
          description: Cambia la contraseña
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /api/v1/access/me/sessions:
    get:
      operationId: listMySessions
      tags:
      - security
      summary: Lista sesiones propias
      description: Paginada.
      x-authorization:
        kind: permission
        permission: sessions:read:own
      responses:
        '200':
          description: Lista sesiones propias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: La página fuera de rango devuelve items vacío.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Máximo 100.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt
          - -createdAt
        description: Allowlist. El desempate estable es el id.
  /api/v1/access/me/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags:
      - security
      summary: Revoca una sesión propia
      description: Idempotente si ya estaba revocada. La ajena responde 404.
      x-authorization:
        kind: permission
        permission: sessions:revoke:own
      responses:
        '204':
          description: Revoca una sesión propia
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/access/me/passkeys:
    get:
      operationId: listPasskeys
      tags:
      - security
      summary: Lista passkeys
      description: El identificador de UI es interno.
      x-authorization:
        kind: permission
        permission: security:manage:own
      responses:
        '200':
          description: Lista passkeys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: La página fuera de rango devuelve items vacío.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Máximo 100.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt
          - -createdAt
        description: Allowlist. El desempate estable es el id.
  /api/v1/access/me/passkeys/registration/options:
    post:
      operationId: passkeyRegistrationOptions
      tags:
      - security
      summary: Opciones de alta
      description: Sesión propia o sesión restringida de alta.
      x-authorization:
        kind: permission
        anyOf:
        - permission: security:manage:own
        - sessionState: passkey-enrollment
      responses:
        '200':
          description: Opciones de alta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
  /api/v1/access/me/passkeys/registration/verify:
    post:
      operationId: passkeyRegistrationVerify
      tags:
      - security
      summary: Verifica el alta
      description: Ata el desafío y no guarda biometría ni clave privada.
      x-authorization:
        kind: permission
        anyOf:
        - permission: security:manage:own
          recentVerification: true
        - sessionState: passkey-enrollment
      responses:
        '201':
          description: Verifica el alta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyAttestation'
  /api/v1/access/me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      tags:
      - security
      summary: Renombra una passkey
      description: Solo el nombre.
      x-authorization:
        kind: permission
        permission: security:manage:own
      responses:
        '200':
          description: Renombra una passkey
          content:
            application/json:
              schema:
