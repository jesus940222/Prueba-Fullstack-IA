      tags:
      - internal
      summary: Correos de administradores de alertas
      description: Solo el servicio ai. No está en el proxy público. Sin userIds
        devuelve los administradores activos con ai:alerts:read. Omite usuarios
        inactivos o sin ese permiso.
      x-authorization:
        kind: service
        audience: access.alert-recipients
      responses:
        '200':
          description: Destinatarios autorizados
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recipients]
                properties:
                  recipients:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [userId, email]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
      security:
      - serviceCredential: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    serviceCredential:
      type: http
      scheme: bearer
      bearerFormat: service-jwt
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
          enum:
          - SESSION_INVALID
          - PERMISSION_DENIED
          - RESOURCE_NOT_VISIBLE
          - CONFLICT
          - IDEMPOTENCY_CONFLICT
          - VALIDATION_ERROR
          - BUSINESS_RULE
          - RATE_LIMITED
          - DEPENDENCY_UNAVAILABLE
          - CSRF_INVALID
          - RECENT_VERIFICATION_REQUIRED
          - RECOVERY_POLICY_DISABLED
          - CHALLENGE_INVALID
        message:
          type: string
          maxLength: 300
        correlationId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
    Empty:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    Accepted:
      type: object
      additionalProperties: false
      required:
      - accepted
      properties:
        accepted:
          const: true
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    AuthStep:
      type: object
      additionalProperties: false
      required:
      - nextStep
      properties:
        challengeId:
          type: string
          format: uuid
        nextStep:
          enum:
          - EMAIL_CHALLENGE
          - PASSKEY_CHALLENGE
          - PASSKEY_ENROLLMENT_REQUIRED
          - RECOVERY_RESTRICTED
          - AUTHENTICATED
        expiresAt:
          type: string
          format: date-time
        options:
          type: object
          description: Opciones públicas de WebAuthn cuando el paso las necesita.
            No incluyen clave privada.
    ChallengeProof:
      type: object
      additionalProperties: false
      required:
      - proof
      properties:
        proof:
          type: string
          minLength: 1
          maxLength: 8000
    ForgotPassword:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPassword:
      type: object
      additionalProperties: false
      required:
      - token
      - password
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
        password:
          type: string
          minLength: 12
          maxLength: 200
    Profile:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - givenName
      - familyName
      - themePreference
      - status
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        givenName:
          type: string
          minLength: 1
          maxLength: 80
        familyName:
          type: string
          minLength: 1
          maxLength: 80
        phoneE164:
          type:
          - string
          - 'null'
        themePreference:
          enum:
          - light
          - dark
          - system
        status:
          enum:
          - invited
          - active
          - disabled
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: []
      properties:
        givenName:
          type: string
          minLength: 1
          maxLength: 80
        familyName:
          type: string
          minLength: 1
          maxLength: 80
        phoneCountryCode:
          type: string
          pattern: ^[A-Z]{2}$
        phoneNumber:
          type: string
          pattern: ^[0-9]{4,15}$
        themePreference:
          enum:
          - light
          - dark
          - system
      description: Al menos un campo. El servidor rechaza el objeto vacío.
    PermissionList:
      type: object
      additionalProperties: false
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    PasswordChange:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 4000
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - expiresAt
      - revoked
      properties:
        id:
          type: string
          format: uuid
        authenticationMethod:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        revoked:
          type: boolean
    SessionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalItems
      - totalPages
      - page
      - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
