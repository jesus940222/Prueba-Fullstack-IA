[project]
name = "portal-ai"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.157.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "qdrant-client==1.19.1",
  "langgraph==1.2.16",
  "pika==1.3.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=portal_ai --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
omit = [
  "portal_ai/composition/*",
  "portal_ai/infrastructure/clients.py",
  "portal_ai/infrastructure/persistence/*",
  "portal_ai/infrastructure/qdrant/*",
]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
