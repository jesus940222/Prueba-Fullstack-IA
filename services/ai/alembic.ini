[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = WARNING

[formatter_generic]
format = %(levelname)s
